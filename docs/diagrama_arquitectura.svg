<text x="830.0" y="736" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#212121">Ciclo de supervisión</text>
<text x="700" y="772" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#212121">1. Python mide la planta</text>
<text x="700" y="798" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#212121">2. CODESYS decide el estado</text>
<text x="700" y="824" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#212121">3. FluidSIM mueve la</text>
<text x="722" y="850" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#212121">compuerta</text>
<text x="700" y="876" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#212121">4. El final de carrera fija</text>
<text x="722" y="902" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#212121">el sentido del aire</text>
<text x="722" y="928" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#212121">en la planta</text>
