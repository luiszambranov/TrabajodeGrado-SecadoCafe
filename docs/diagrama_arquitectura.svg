<text x="335.0" y="178" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Python · planta simulada</text>
<text x="132" y="233" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#212121">• Clima, lecho de 8 capas y cinética</text>
<text x="132" y="266" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#212121">• Resistencia de 6 kW y ventilador</text>
<text x="132" y="299" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#212121">• Servidor Modbus TCP (puerto 5020)</text>
