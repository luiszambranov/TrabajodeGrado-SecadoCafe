<text x="132" y="871" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#212121">• Compuerta de inversión del aire</text>
<text x="132" y="904" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#212121">• Entrada y salida de la bandeja</text>
