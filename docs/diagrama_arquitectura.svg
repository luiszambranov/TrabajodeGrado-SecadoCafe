<text x="335.0" y="497" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">CODESYS · supervisión (PLC)</text>
<text x="132" y="552" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#212121">• PLC_PRG: consigna y watchdog</text>
<text x="132" y="585" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#212121">• SECUENCIA: máquina de estados</text>
<text x="132" y="618" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="21" fill="#212121">• Alarmas y fin de secado</text>
