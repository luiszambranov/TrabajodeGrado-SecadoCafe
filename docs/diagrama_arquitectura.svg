<text x="702" y="552" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#212121">• Elige perfil y caudal</text>
<text x="702" y="585" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#212121">• START, STOP, Nuevo lote</text>
<text x="702" y="618" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#212121">• Ve variables y alarmas</text>
